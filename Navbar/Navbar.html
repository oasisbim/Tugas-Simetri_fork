<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-white-100 px-10 py-4 shadow-md">
        <div class="mx-auto flex items-center justify-between">
            <div class="flex items-center">
                <img src="images/logo-simetri.png" alt="Logo Simetri" class="h-20 w-auto" />
                <div class="text-left leading-tight">
                    <span class="font-bold text-lg">Simetri 2026</span>
                </div>
            </div>
            <div class="flex space-x-5">
                <div class="flex items-center space-x-3">
                    <img src="images/Exclude.png" alt="Twitter" class="h-10 w-auto" />
                    <div class="text-left leading-tight">
                        <span class="font-bold text-lg">Twitter</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <img src="images/ig-logo.png" alt="Instagram" class="h-10 w-auto" />
                    <div class="text-left leading-tight">
                        <span class="font-bold text-lg">Instagram</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <img src="images/Tiktok.png" alt="Tiktok" class="h-10 w-auto" />
                    <div class="text-left leading-tight">
                        <span class="font-bold text-lg">Tiktok</span>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <img src="images/yt-logo.png" alt="YouTube" class="h-10 w-auto" />
                    <div class="text-left leading-tight">
                        <span class="font-bold text-lg">YouTube</span>
                    </div>
                </div>
            </div>
        </div>

    </nav>
    </div>
</body>

</html>

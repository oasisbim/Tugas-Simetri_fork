<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> 
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        zelda: ['"zelda"', 'sans-serif'], 
                    } 
                } 
            } 
        }
    </script>

    <style> 
        @font-face { 
            font-family: 'zelda'; 
            src: url('./font/zelda.otf') format('opentype'); 
            font-weight: 400; 
            font-style: normal; } 
    </style>
</head>

<body class="bg-gray-100 font-zelda">
    <header class="sticky top-0">
        <nav class="flex items-center justify-between bg-[#7A3D21] px-[90px] h-[90px]">
            <div class="flex items-center gap-16">
                <img img src="images/navbar/logo-simetri.png" alt="Logo Simetri" class="h-20 w-auto">
                <ul class="flex items-center gap-16 text-[32px] text-white">
                    <li><a href="" class="text-[#aa5a34]">Home</a></li>
                    <li><a href="" class="text-[#aa5a34] hover:text-[#F9DCB4]">Tema</a></li>
                    <li><a href="" class="underline text-[#F9DCB4] hover:text-[#F9DCB4]">Materi</a></li>
                    <li><a href="" class="text-[#aa5a34] hover:text-[#F9DCB4]">Asik</a></li>
                </ul>
            </div>
            <div class="flex items-center gap-2.5">
                <a href="https://x.com/HMSI_ITS?s=20">
                    <img src="images/navbar/Exclude.png" alt="Twitter" class="h-10 w-auto">
                </a>
                <a href="https://www.tiktok.com/@hmsi_its">
                    <img src="images/navbar/Tiktok.png" alt="Tiktok" class="h-10 w-auto" >
                </a>
                <a href="https://www.instagram.com/hmsi_its/">
                    <img src="images/navbar/ig-logo.png" alt="Instagram" class="h-10 w-auto" >
                </a>
                <a href="https://www.youtube.com/@layarHMSI">
                    <img src="images/navbar/yt-logo.png" alt="Youtube" class="h-10 w-auto">
                </a>
            </div>
        </nav>
    </header>

    <main>
        
        <section>
            <div class="relative overflow-hidden">
                <img src="images/materi/bg-hero.svg" alt="hero" class="block w-full h-auto">
            
                <div class="absolute inset-0 flex flex-col justify-center items-center">
                    <h1 class="text-white text-[clamp(1.5rem,7vw,6rem)]">WHAT YOU WILL LEARN</h1>

                    <div class="items-center">
                        <img class="w-3vw" src="images/materi/wood-hero.png" alt="wood">
                    </div>

                    <button class="bg-blu-400">ACCES MODUL</button>
                </div>
            </div>
        </section>

        <section>
            <img src="images/materi/bg-about.svg" alt="hero" class="w-full h-full object-cover">
        </section>

        <section>
            <img src="images/materi/bg-section3.svg" alt="hero" class="w-full h-full object-cover">
        </section>

        <section>
            <img src="images/materi/bg-section4.svg" alt="hero" class="w-full h-full object-cover">
        </section>

    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> 
        tailwind.config = { 
            theme: { 
                extend: { 
                    fontFamily: { 
                        zelda: ['"zelda"', 'sans-serif'], 
                    } 
                } 
            } 
        }
    </script>

    <style> 
        @font-face { 
            font-family: 'zelda'; 
            src: url('./font/zelda.otf') format('opentype'); 
            font-weight: 400; 
            font-style: normal; } 
    </style>
</head>

<body class="font-zelda">
    <header class="border-b-[6px] border-[#4C1C0E]">
        <nav class="flex items-center justify-between bg-[#7A3D21] px-6 md:px-16 h-[90px]">
            <div class="flex items-center gap-12 lg:gap-16">
                <img src="images/navbar/logo-simetri.png" alt="Logo Simetri" class="h-[92.72998046875px] lg:h-[132.78564453125px] w-auto">
                <ul class="hidden md:flex items-center gap-10 lg:gap-14 text-2xl lg:text-[32px] text-[#C07E4E]">
                   <li><a href="#" class="hover:text-[#F9DCB4] transition-colors">Home</a></li>
                    <li><a href="#" class="hover:text-[#F9DCB4] transition-colors">Tema</a></li>
                    <li><a href="#" class="underline underline-offset-8 text-[#F9DCB4]">Materi</a></li>
                    <li><a href="#" class="hover:text-[#F9DCB4] transition-colors">Asik</a></li>
                </ul>
            </div>

            <div class="hidden md:flex items-center gap-3 lg:gap-4">
                <a href="https://x.com/HMSI_ITS?s=20" target="_blank">
                    <img src="images/navbar/twitter-logo.png" alt="Twitter" class="h-9 lg:h-10 w-auto hover:opacity-85 transition-opacity">
                </a>
                <a href="https://www.tiktok.com/@hmsi_its" target="_blank">
                    <img src="images/navbar/Tiktok.png" alt="Tiktok" class="h-9 lg:h-10 w-auto hover:opacity-85 transition-opacity">
                </a>
                <a href="https://www.instagram.com/hmsi_its/" target="_blank">
                    <img src="images/navbar/ig-logo.png" alt="Instagram" class="h-9 lg:h-10 w-auto hover:opacity-85 transition-opacity">
                </a>
                <a href="https://www.youtube.com/@layarHMSI" target="_blank">
                    <img src="images/navbar/yt-logo.png" alt="Youtube" class="h-9 lg:h-10 w-auto hover:opacity-85 transition-opacity">
                </a>
            </div>

            <button id="menu-btn" class="md:hidden bg-[#4C1C0E] rounded-xl flex justify-center items-center w-12 h-12">
                <img id="menu-icon" src="images/navbar/hamburger-menu.svg" alt="Menu" class="w-6 h-auto">
            </button>
        </nav>

        <div id="mobile-menu" class="hidden md:hidden bg-[#F6EBD7] shadow-xl text-center">
            <ul class="flex flex-col text-2xl text-[#C07E4E] gap-[10px] text-[32px]">
                <li class="py-4"><a href="#">Home</a></li>
                <li class="py-4"><a href="#">Tema</a></li>
                <li class="py-4 bg-[#F9DCB4]"><a href="#" class="underline underline-offset-8 text-[#7A3D21]">Materi</a></li>
                <li class="py-4"><a href="#">Asik</a></li>
            </ul>

            <div class="flex justify-center items-center gap-[15px] py-4">
                <a href="https://x.com/HMSI_ITS?s=20" target="_blank" rel="noopener noreferrer">
                    <img src="images/navbar/twitter-dark.svg" alt="Twitter" class="h-10 w-auto">
                </a>
                <a href="https://www.tiktok.com/@hmsi_its" target="_blank" rel="noopener noreferrer">
                    <img src="images/navbar/Tiktok-dark.svg" alt="Tiktok" class="h-10 w-auto">
                </a>
                <a href="https://www.instagram.com/hmsi_its/" target="_blank" rel="noopener noreferrer">
                    <img src="images/navbar/ig-logo-dark.svg" alt="Instagram" class="h-10 w-auto">
                </a>
                <a href="https://www.youtube.com/@layarHMSI" target="_blank" rel="noopener noreferrer">
                    <img src="images/navbar/yt-logo-dark.svg" alt="Youtube" class="h-10 w-auto">
                </a>
            </div>
        </div>
    </header>

    <main> 
        <section>
            <div class="relative overflow-hidden">
                <img src="images/materi/bg-hero.svg" alt="hero" class="block w-full h-auto">
            
                <div class="absolute inset-0 flex flex-col justify-center items-center">
                    <h1 class="text-white text-[clamp(1.5rem,7vw,6rem)]">WHAT YOU WILL LEARN</h1>

                    <div class="items-center">
                        <img class="w-3vw" src="images/materi/wood-hero.png" alt="wood">
                    </div>

                    <button class="bg-blu-400">ACCES MODUL</button>
                </div>
            </div>
        </section>

        <section>
            <div class="relative">
                <img src="images/materi/bg-about.svg" alt="hero" class="w-full h-full object-cover">
                <div class="absolute left-1/2 top-[calc(50%+20px)] m-0 -translate-x-1/2 -translate-y-1/2 w-[75%]">
                    <img src="images/materi/paper-about.png" alt="about">

                    <div class="absolute inset-0 z-10 flex flex-col items-center justify-center mx-20 gap-2">
                        <h1 class="relative text-4xl">
                            <p class="absolute top-[5px] text-orange-800">
                                YOUR JOURNEY STARTS HERE
                            </p>
                            <p class="absolute inset-0 text-white">
                                YOUR JOURNEY STARTS HERE
                            </p>
                        </h1>
                        <p class="font-['Times_New_Roman',serif] text-xl font-bold text-orange-800">
                            Di SIMETRI, peserta belajar bla bla bla
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <img src="images/materi/bg-section3.svg" alt="hero" class="w-full h-full object-cover">
        </section>

        <section>
            <img src="images/materi/bg-section4.svg" alt="hero" class="w-full h-full object-cover">
        </section>

    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const menuIcon = document.getElementById('menu-icon');
        const mobileMenu = document.getElementById('mobile-menu');

        const hamburgerSrc = 'images/navbar/hamburger-menu.svg';
        const closeSrc = 'images/navbar/x-icon.svg';

        menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.toggle('hidden');
            
            if (isHidden) {
                menuIcon.src = hamburgerSrc;
            } else {
                menuIcon.src = closeSrc;
            }
        });
    </script>
</body>

</html>
